name: CI
run-name: Test ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python) and the newest release.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --locked keeps the exact versions someone tested; master does not have
      # uv.lock yet, so resolve there instead of failing.
      - name: Install
        run: if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      # The display tests click and type on a real screen: they skip themselves
      # here. `xvfb-run -a pytest -q` runs them locally (see README, Development).
      - name: Unit tests
        run: uv run --extra test pytest -q -m "not display"

      - name: Build the wheel and the sdist
        run: uv build

  # master is what gets published, so the only way in is the branch that has
  # already been running on develop. A hotfix goes to develop first.
  master-takes-develop:
    name: master only takes develop
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The pull request comes from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::master only takes pull requests from develop, and this one comes from '$HEAD_REF'"
            exit 1
          fi
